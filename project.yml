name: MomentFinder
options:
  bundleIdPrefix: com.youngim
  developmentLanguage: ko
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  MomentFinder:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MomentFinder
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.youngim.momentfinder.indexing]
    settings:
      base:
        PRODUCT_NAME: MomentFinder
        PRODUCT_BUNDLE_IDENTIFIER: com.youngim.momentfinder
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Moment Finder
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 사진과 동영상을 기기 안에서 분석해 "고양이 하품" 같은 문장으로 검색할 수 있게 합니다. 사진은 외부로 전송되지 않습니다.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/MomentFinder-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES

  MomentFinderTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MomentFinderTests
    dependencies:
      - target: MomentFinder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.youngim.momentfinder.tests

  MomentFinderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MomentFinderUITests
    dependencies:
      - target: MomentFinder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.youngim.momentfinder.uitests
        TEST_TARGET_NAME: MomentFinder

schemes:
  MomentFinderUITests:
    build:
      targets:
        MomentFinderUITests: [test]
    test:
      config: Debug
      targets:
        - MomentFinderUITests

  MomentFinder:
    build:
      targets:
        MomentFinder: all
        MomentFinderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MomentFinderTests
